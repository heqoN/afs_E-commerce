<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Products — AFS Store</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<script>
  // Dark mode toggle
  function toggleDark() {
    document.body.classList.toggle('dark');
    const btn = document.querySelector('.dark-toggle');
    btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    localStorage.setItem('darkMode', document.body.classList.contains('dark'));
  }

  // Remember dark mode preference
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.querySelector('.dark-toggle').textContent = '☀️';
  }
</script>
<body>

  <nav>
    <a href="index.html" class="nav-logo">
  <span style="background:#2563eb; color:white; padding:4px 10px; border-radius:8px; font-weight:700; font-size:1.1rem; letter-spacing:2px;">AFS</span>
  <span style="color:#2563eb; font-weight:700; font-size:1.1rem; margin-left:6px;">Store</span>
</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart</a></li>
      <li><a href="auth.html">Sign In</a></li>
    </ul>
    <div class="nav-right">
       <button class="dark-toggle" onclick="toggleDark()">🌙</button>
      <a href="cart.html" class="cart-icon">🛒 <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </nav>

  <main style="max-width:1200px; margin:2rem auto; padding:0 1.5rem;">
    <div style="display:flex; gap:1rem; align-items:center; margin-bottom:2rem; flex-wrap:wrap;">
      <input type="text" id="search-input" placeholder="Search products..." style="padding:.6rem 1rem; border:1px solid var(--border); border-radius:8px; font-size:.95rem; flex:1; min-width:200px;"/>
      <select id="category-filter" style="padding:.6rem 1rem; border:1px solid var(--border); border-radius:8px; font-size:.95rem;">
        <option value="all">All Categories</option>
        <option value="electronics">Electronics</option>
        <option value="accessories">Accessories</option>
        <option value="clothing">Clothing</option>
        <option value="sports">Sports</option>
        <option value="home">Home</option>
      </select>
      
      <select id="sort-select" style="padding:.6rem 1rem; border:1px solid var(--border); border-radius:8px; font-size:.95rem;">
        <option value="">Sort by Price</option>
        <option value="asc">Price: Low to High</option>
        <option value="desc">Price: High to Low</option>
      </select>
    </div>

    <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
      <label style="font-size:.9rem; color:var(--text-secondary); white-space:nowrap;">Price range:</label>
      <input type="range" id="price-min" min="0" max="900" value="0" step="10"
        style="flex:1; min-width:120px; accent-color:var(--primary);"
        oninput="updatePriceLabel(); filterProducts();" />
      <input type="range" id="price-max" min="0" max="900" value="900" step="10"
        style="flex:1; min-width:120px; accent-color:var(--primary);"
        oninput="updatePriceLabel(); filterProducts();" />
      <span id="price-label" style="font-size:.9rem; font-weight:600; color:var(--primary); white-space:nowrap; min-width:110px;">$0 — $900</span>
    </div>

    <p id="product-count" style="font-size:0.85rem; color:#64748b; margin-bottom:1rem;"></p>

    <div id="product-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:1.5rem;"></div>
  </main>

  <div class="toast" id="toast">✅ Added to cart!</div>
<footer>
  <p style="font-size:1.1rem; font-weight:700; margin-bottom:0.5rem;">AFS Store</p>
  <p style="opacity:0.6; font-size:0.85rem; margin-bottom:1rem;">Your one-stop shop for everything.</p>
  <div style="display:flex; justify-content:center; gap:1.5rem; margin-bottom:1rem;">
    <a href="#" style="color:white; text-decoration:none; font-size:0.85rem; opacity:0.8; transition:opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">Instagram</a>
    <a href="#" style="color:white; text-decoration:none; font-size:0.85rem; opacity:0.8;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">Twitter</a>
    <a href="#" style="color:white; text-decoration:none; font-size:0.85rem; opacity:0.8;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">Facebook</a>
    <a href="#" style="color:white; text-decoration:none; font-size:0.85rem; opacity:0.8;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">YouTube</a>
  </div>
  <p style="opacity:0.5; font-size:0.8rem;">© 2025 AFS Store. All rights reserved.</p>
</footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
