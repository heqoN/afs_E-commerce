<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AFS Store — Online Shop</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<script>
  // Dark mode toggle
  function toggleDark() {
    document.body.classList.toggle('dark');
    const btn = document.querySelector('.dark-toggle');
    btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    localStorage.setItem('darkMode', document.body.classList.contains('dark'));
  }

  // Remember dark mode preference
  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
    document.querySelector('.dark-toggle').textContent = '☀️';
  }
</script>
<body>
  <!-- Navbar: sticky top navigation with logo, links and cart icon -->
  <nav>
    <a href="index.html" class="nav-logo">
  <span style="background:#2563eb; color:white; padding:4px 10px; border-radius:8px; font-weight:700; font-size:1.1rem; letter-spacing:2px;">AFS</span>
  <span style="color:#2563eb; font-weight:700; font-size:1.1rem; margin-left:6px;">Store</span>
</a>
    <!-- Hamburger button for mobile -->
    <button class="hamburger" onclick="this.closest('nav').querySelector('.nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
    <div class="nav-right"> 
      <!-- Dark mode toggle -->
      <button class="dark-toggle" onclick="toggleDark()">🌙</button>
      <a href="cart.html" class="cart-icon">🛒 <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </nav>

  <!-- Hero: main banner with call-to-action buttons -->
  <section class="hero">
    <h1>Welcome to AFS Store</h1>
    <p>Discover the best products at unbeatable prices</p>
    <a href="products.html" class="btn btn-primary">Shop Now</a>
    <a href="#featured" class="btn btn-outline">Explore</a>
  </section>

  <!-- Featured Products: dynamically rendered by app.js -->
  <section id="featured" style="max-width:1200px; margin:3rem auto; padding:0 1.5rem;">
    <h2 style="font-size:1.8rem; font-weight:700; margin-bottom:1.5rem;">Featured Products</h2>
    <div id="product-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:1.5rem;"></div>
  </section>

  <!-- Toast notification for add to cart feedback -->
  <div class="toast" id="toast">✅ Added to cart!</div>

  <!-- Footer -->
  <footer>
    <p>© 2026 AFS Store. All rights reserved.</p>
  </footer>

  <!-- Scripts: products data, cart logic, app logic -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
