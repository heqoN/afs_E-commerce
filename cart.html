<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart — ShopHub</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="index.html" class="nav-logo">ShopHub</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Cart</a></li>
    </ul>
    <div class="nav-right">
      <a href="cart.html" class="cart-icon">🛒 <span class="cart-count" id="cart-count">0</span></a>
    </div>
  </nav>

  <!-- Cart Page Main Content -->
  <main style="max-width:800px; margin:2rem auto; padding:0 1.5rem;">
    <h2 style="font-size:1.8rem; font-weight:700; margin-bottom:1.5rem;">Your Cart</h2>

    <!-- Cart items rendered dynamically by cart-page.js -->
    <div id="cart-items"></div>

    <!-- Order summary shown when cart is not empty -->
    <div id="cart-summary" style="display:none; margin-top:2rem; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:1.2rem; font-weight:600;">Total:</span>
        <span style="font-size:1.5rem; font-weight:700; color:var(--primary);" id="cart-total">$0</span>
      </div>
      <!-- Checkout button -->
      <button class="btn btn-primary" style="width:100%; margin-top:1rem; padding:1rem;" onclick="alert('Order placed successfully!')">
        Proceed to Checkout
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer><p>© 2025 ShopHub. All rights reserved.</p></footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
